name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check fuzz target formatting
        run: cargo fmt --manifest-path crates/hyperion_protocol/fuzz/Cargo.toml --all -- --check

  clippy:
    name: Lint (clippy, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Build and test
        run: cargo nextest run --workspace

  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      # Uploads to Codecov if the repo is linked; never fails CI on its own.
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: License/bans (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: Protocol fuzz smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fuzz_target: [frame, handshake, status, login, configuration, play, nbt]
    env:
      CARGO_FUZZ_VERSION: 0.12.0
      FUZZ_TIME: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust
        run: rustup toolchain install nightly
      - name: Install cargo-fuzz
        run: cargo install --locked --version "${CARGO_FUZZ_VERSION}" cargo-fuzz
      - name: Build fuzz target
        working-directory: crates/hyperion_protocol/fuzz
        run: cargo +nightly fuzz build "${{ matrix.fuzz_target }}"
      - name: Run fuzz smoke test
        working-directory: crates/hyperion_protocol/fuzz
        run: cargo +nightly fuzz run "${{ matrix.fuzz_target }}" -- -max_total_time="${FUZZ_TIME}"
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.fuzz_target }}-${{ github.sha }}
          path: crates/hyperion_protocol/fuzz/artifacts
