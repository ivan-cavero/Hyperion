[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/ivan-cavero/Hyperion"
readme = "README.md"
authors = ["Hyperion contributors"]
description = "Hyperion — a native, multithreaded Minecraft server written in Rust."
categories = ["network-programming", "game-engines"]
keywords = ["minecraft", "server", "multithreading", "game", "networking"]

# ─────────────────────────────────────────────────────────────
#  WHITELIST DEPENDENCIES
#  Only audited crates may be added (see docs/DEPENDENCIES.md).
#  Rule: no new dependency without an audit PR. Everything that is
#  Minecraft-specific (protocol, NBT, worldgen, world formats,
#  simulation, plugin ABI) is implemented here, with no third-party.
# ─────────────────────────────────────────────────────────────

[workspace.dependencies]
# Phase 1 (network/protocol):
tokio = { version = "1", features = ["full"] }        # async runtime (Tokio team)
bytes = "1"                                           # buffers (Tokio team)
flate2 = "1"                                          # zlib/deflate
sha1 = "0.10"                                         # handshake (RustCrypto) — pinned by rsa 0.9
sha2 = "0.10"                                         # (RustCrypto) — pinned by rsa 0.9
aes = "0.8"                                           # encryption (RustCrypto)
rsa = "0.9"                                           # RSA handshake (RustCrypto) — awaiting 0.10 for rand 0.10 + sha1 0.11
rand = "0.10"                                          # RNG — pinned by rsa 0.9 (awaits rsa 0.10 for rand 0.10)
serde = { version = "1", features = ["derive"] }      # extracted data
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] } # mc-ref jar read (tools only)
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] } # logging (Tokio team)
md5 = "0.8"                                           # offline UUID v3 (RustCrypto) — vanilla "OfflinePlayer:<name>"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] } # HTTP client (Mojang session server); rustls avoids openssl

# Phase 3 (simulation):
rayon = "1"                                           # data parallelism
crossbeam = "0.8"                                     # concurrency utilities
parking_lot = "0.12"                                  # faster locks
dashmap = "6"                                         # concurrent maps

# Phase 4 (plugins):
wasmtime = "46"        # WASM runtime (latest stable, needs Rust ≥1.94)
mlua = { version = "0.11", features = ["lua54"] }     # Lua scripting (latest stable, needs Rust ≥1.88)

# Dev-only tooling (never shipped):
divan = "0.1"                                          # benchmarks (stable Rust, no nightly)

# Open decision (Phase 3): bevy_ecs vs a custom minimal ECS.
# bevy_ecs = "0.14"

# Release profile: build for throughput from day one.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Dev profile: keep local iteration fast but usable.
[profile.dev]
opt-level = 1

# Benchmark profile: keep debug info so Divan can attribute samples to lines.
[profile.bench]
debug = 2

# Shared lints, applied by every crate via `[lints] workspace = true`
# (policy: CONTRIBUTING.md — no `unsafe` without justification).
[workspace.lints.rust]
unsafe_code = "deny"